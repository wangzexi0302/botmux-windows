name: Sync upstream

on:
  schedule:
    # Monday / Thursday 09:17 China Standard Time (UTC+8).
    - cron: '17 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'wangzexi0302/botmux-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      validate: ${{ steps.sync.outputs.validate }}
      ref: ${{ steps.sync.outputs.ref }}
      head_sha: ${{ steps.sync.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/windows
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fast-forward mirror and prepare sync PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-upstream.mjs

  # Run validation directly: a PR created with GITHUB_TOKEN may need approval
  # before its pull_request workflow can run. This path needs no PAT secret.
  validate:
    needs: sync
    if: needs.sync.outputs.validate == 'true'
    uses: ./.github/workflows/windows-ci.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}

  status:
    needs: [sync, validate]
    if: always() && needs.sync.outputs.validate == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report validation on the sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}
          RESULT: ${{ needs.validate.result }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context='upstream-sync/compatibility' \
            -f description='Windows and Linux merge validation' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
