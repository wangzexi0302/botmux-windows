name: Windows compatibility

on:
  push:
    branches: [codex/windows]
  pull_request:
    branches: [codex/windows]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify native Windows CLI entry
        if: runner.os == 'Windows'
        run: bun run windows:cli --help
      - name: Verify executable discovery and real PTY lifecycle
        run: bun run test -- test/windows-launch.test.ts test/windows-shell-hints.test.ts test/executable.test.ts test/pty-backend-launch-shell.test.ts test/windows-stdin-encoding.test.ts test/backend-gate.test.ts test/cli-runtime-update.test.ts test/codex-coco-detect-models.test.ts
      - name: Verify upstream sync against disposable Git repositories
        run: node --test test/sync-upstream.test.mjs
      - name: Verify supervisor lifecycle and native Windows control
        run: bun run test -- test/windows-supervisor-control.test.ts test/fleet-supervisor.integration.test.ts test/index-supervisor-env-boundary.test.ts test/fleet-command-queue.test.ts
      - name: Verify Codex title helper process lifecycle
        run: bun run test -- test/codex-app-threads.test.ts
      - name: Verify Zellij platform boundaries and existing session behavior
        run: bun run test -- test/windows-zellij.test.ts test/zellij-backend-helpers.test.ts test/zellij-frozen-reattach.test.ts test/zellij-observe-backend.test.ts test/zellij-session-discovery.test.ts
      - name: Install pinned native Zellij for lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zellijDir = Join-Path $env:RUNNER_TEMP 'botmux-zellij-0.45.1'
          New-Item -ItemType Directory -Force -Path $zellijDir | Out-Null
          $archive = Join-Path $zellijDir 'zellij.zip'
          Invoke-WebRequest 'https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'b854e7b223e67d0705c5f685ef50541c38a57981b13624d09c92bed419b6f80d') { throw 'Zellij checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $zellijDir
          $zellijDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify real native Zellij persistence and Unicode
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-zellij.mjs
